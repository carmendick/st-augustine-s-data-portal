{% extends "base.html" %}

{% block content %}

<div class="page-header">

<h1>

Notifications

</h1>

</div>

{% for notification in notifications %}

<div class="card">

<div class="card-body">

<h3>

{{ notification.title }}

</h3>

<p>

{{ notification.message }}

</p>

<small>

{{ notification.created }}

</small>

</div>

</div>

<br>

{% empty %}

<p>

You have no notifications.

</p>

{% endfor %}

{% endblock %}
